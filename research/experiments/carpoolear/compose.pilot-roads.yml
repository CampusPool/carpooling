# Opt-in prepared local road graphs. Same canonical persistent DB, no public ports.
x-road-environment: &road-environment
  MOBILITY_ROUTING_PROVIDER: osrm
  MOBILITY_ROUTING_CAR_BASE_URL: http://mobility-road-router-car:5000
  MOBILITY_ROUTING_BIKE_BASE_URL: http://mobility-road-router-bike:5000
  MOBILITY_ROUTING_FOOT_BASE_URL: http://mobility-road-router-foot:5000
  MOBILITY_ROUTING_CAR_PROFILE: driving
  MOBILITY_ROUTING_BIKE_PROFILE: driving
  MOBILITY_ROUTING_FOOT_PROFILE: driving
  MOBILITY_ROUTING_CAR_EXPECTED_DATA_VERSION: ${MOBILITY_PROOF_CAR_PIN:?Prepared car graph required}
  MOBILITY_ROUTING_BIKE_EXPECTED_DATA_VERSION: ${MOBILITY_PROOF_BIKE_PIN:?Prepared motorcycle graph required}
  MOBILITY_ROUTING_FOOT_EXPECTED_DATA_VERSION: ${MOBILITY_PROOF_FOOT_PIN:?Prepared pedestrian graph required}
  MOBILITY_ROUTING_PRICING_VERSION: demo-v1
  MOBILITY_ROUTING_CAR_MINOR_PER_KM: "800"
  MOBILITY_ROUTING_BIKE_MINOR_PER_KM: "400"
  MOBILITY_ROUTING_SYNTHETIC_ONLY: "false"
services:
  app:
    environment: *road-environment
    networks: [appnet, roads]
  dispatch-worker:
    environment: *road-environment
    networks: [appnet, roads]
networks:
  roads:
    external: true
    name: mobility-road-router-internal
