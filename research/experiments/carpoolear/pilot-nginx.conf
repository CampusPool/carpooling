# Only this credential-free gateway has a host-published interface. The PHP app
# and database stay on the internal network without outbound internet access.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;
    access_log off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    location / {
        set $mobility_app app:8000;
        proxy_pass http://$mobility_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
