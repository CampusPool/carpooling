# Disposable verifier only: concurrent commute HTTP requests need multiple workers.
services:
  app:
    environment:
      PHP_CLI_SERVER_WORKERS: "4"
    command: php artisan serve --host=0.0.0.0 --port=8000 --no-reload
    volumes:
      - ./booking-concurrency-probe.php:/opt/mobility/booking-concurrency-probe.php:ro
