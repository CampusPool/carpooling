name: Bug report
description: Report a reproducible problem
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected versus actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots and environment (exclude student PII)
