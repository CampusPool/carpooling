name: CampusPool Next

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: campuspool

jobs:
  foundation-and-feature-checks:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: campuspool
          MYSQL_USER: campuspool
          MYSQL_PASSWORD: campuspool
          MYSQL_ROOT_PASSWORD: campuspool-root
        ports:
          - 13316:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pcampuspool-root"
          --health-interval=10s --health-timeout=5s --health-retries=12
          --health-start-period=20s
      mongo:
        image: mongo:8.0
        ports:
          - 13317:27017
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval=10s --health-timeout=5s --health-retries=12
          --health-start-period=10s
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: campuspool/package-lock.json

      - name: Install
        run: npm ci

      - name: Static checks
        run: |
          npm run typecheck
          npm run lint
          npm test -- --exclude tests/http.e2e.test.ts

      - name: Build production app
        run: npm run build

      - name: Configure runtime and migrate
        env:
          DATABASE_URL: mysql://campuspool:campuspool@127.0.0.1:13316/campuspool
          MONGODB_URI: mongodb://127.0.0.1:13317
          MONGODB_DB: campuspool
          DEMO_PASSWORD: ChangeThisDemoPassword123!
          SESSION_SECRET: campuspool-ci-session-secret-change-me
        run: |
          set -eu
          export MIGRATION_DATABASE_URL=mysql://root:campuspool-root@127.0.0.1:13316/campuspool
          npm run db:migrate
          npm run db:seed

      - name: Integration suite (available tests)
        env:
          RUN_CAMPUSPOOL_INTEGRATION: '1'
          DATABASE_URL: mysql://campuspool:campuspool@127.0.0.1:13316/campuspool
          MONGODB_URI: mongodb://127.0.0.1:13317
          MONGODB_DB: campuspool
          DEMO_PASSWORD: ChangeThisDemoPassword123!
          SESSION_SECRET: campuspool-ci-session-secret-change-me
        run: npm test -- --exclude tests/http.e2e.test.ts

      - name: HTTP E2E when all required feature surfaces exist
        env:
          DATABASE_URL: mysql://campuspool:campuspool@127.0.0.1:13316/campuspool
          MONGODB_URI: mongodb://127.0.0.1:13317
          MONGODB_DB: campuspool
          DEMO_PASSWORD: ChangeThisDemoPassword123!
          SESSION_SECRET: campuspool-ci-session-secret-change-me
        run: |
          set -eu
          required='tests/http.e2e.test.ts src/app/api/bookings/route.ts src/app/api/offers/route.ts src/app/api/vehicles/route.ts src/app/api/cancellations/route.ts src/app/api/activity/route.ts'
          missing=''
          for path in $required; do
            test -f "$path" || missing="$missing $path"
          done
          if [ -n "$missing" ]; then
            echo "requires other features: skipping HTTP E2E; missing:$missing"
            exit 0
          fi
          node scripts/run-http-tests.mjs
