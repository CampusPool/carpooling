name: MobilityPlatform checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: mobility-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  next-client:
    name: Next client checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend-next/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  activity-projection:
    name: Activity projection checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/activity-projection
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/activity-projection/package-lock.json
      - run: npm ci
      - run: npm test

  backend-reconstruction:
    name: Backend reconstruction checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify pinned backend reconstruction and patch stack
        run: sh research/experiments/carpoolear/verify-reconstruction.sh
