name: campuspool-solutions

services:
  mysql:
    image: mysql:8.4
    ports: ["127.0.0.1:13316:3306"]
    environment:
      MYSQL_DATABASE: campuspool
      MYSQL_USER: campuspool
      MYSQL_PASSWORD: campuspool
      MYSQL_ROOT_PASSWORD: campuspool-root
    command: ["--skip-log-bin", "--default-time-zone=+00:00", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes: ["campuspool-mysql:/var/lib/mysql"]
  mongo:
    image: mongo:8.0
    ports: ["127.0.0.1:13317:27017"]
    volumes: ["campuspool-mongo:/data/db"]
volumes:
  campuspool-mysql:
  campuspool-mongo:
