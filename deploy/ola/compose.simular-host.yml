# Simular-only fallback: its nested Docker bridge does not route between containers.
# Every service binds to HOST LOOPBACK; never use this on a shared/untrusted VPS.
services:
  mysql:
    network_mode: host
    networks: !reset []
    command: ["--log-bin-trust-function-creators=1", "--bind-address=127.0.0.1", "--mysqlx=OFF"]
  migrate:
    network_mode: host
    networks: !reset []
    environment:
      DB_HOST: 127.0.0.1
  api:
    network_mode: host
    networks: !reset []
    environment:
      DB_HOST: 127.0.0.1
      HTTP_PROXY: http://127.0.0.1:3128
      HTTPS_PROXY: http://127.0.0.1:3128
      NO_PROXY: localhost,127.0.0.1
    volumes:
      - ./php-fpm-host.conf:/usr/local/etc/php-fpm.d/zzzz-host.conf:ro
  api-web:
    network_mode: host
    networks: !reset []
    volumes:
      - ./api-nginx-host.conf:/etc/nginx/conf.d/default.conf:ro
  frontend:
    network_mode: host
    networks: !reset []
    ports: !reset []
    extra_hosts: ["api-web:127.0.0.1"]
    environment:
      HTTP_PROXY: http://127.0.0.1:3128
      HTTPS_PROXY: http://127.0.0.1:3128
      NO_PROXY: localhost,127.0.0.1,api-web
    command: ["node", "node_modules/next/dist/bin/next", "start", "-H", "127.0.0.1", "-p", "${CAMPUSPOOL_STAGE_PORT:-3040}"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:${CAMPUSPOOL_STAGE_PORT:-3040}/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  https:
    network_mode: host
    networks: !reset []
    ports: !reset []
